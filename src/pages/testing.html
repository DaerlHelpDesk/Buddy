<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ICT Quote Availability Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <span class="navbar-brand">ICT Quotation Availability</span>
  </div>
</nav>

<div class="container mt-4">

  <div class="row">
    <div class="col-md-6">
      <div class="card border-success">
        <div class="card-header bg-success text-white">
          Unallocated Quotes
        </div>
        <div class="card-body text-center">
          <h1 id="unallocatedCount">0</h1>
          <p>PDF quotes available</p>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card border-danger">
        <div class="card-header bg-danger text-white">
          Allocated Quotes
        </div>
        <div class="card-body text-center">
          <h1 id="allocatedCount">0</h1>
          <p>PDF quotes already used</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  // This will be populated by backend
  fetch("/quote-status")
    .then(res => res.json())
    .then(data => {
      document.getElementById("unallocatedCount").innerText = data.unallocated;
      document.getElementById("allocatedCount").innerText = data.allocated;
    });
</script>

</body>
</html>
